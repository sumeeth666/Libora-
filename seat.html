<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Libora - Study Time</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="dashboard-header">

        <div>
            <h1>LIBORA</h1>
            <p>Your Seat, Your Study Time</p>
        </div>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </header>


    <main class="study-page">

        <div class="study-card">

            <h2>Seat <span id="selectedSeat">--</span></h2>

            <p class="study-description">
                Your seat has been reserved.
            </p>

            <div class="arrival-box">

                <h3>Reach your seat within</h3>

                <div id="arrivalTimer">
                    10:00
                </div>

                <p>
                    Your reservation will be cancelled
                    if you don't reach the library in time.
                </p>

            </div>


            <div id="studySelection">

                <h2>Choose Your Study Time</h2>

                <p>Select one option:</p>


                <div class="time-options">

                    <button class="time-btn" data-time="30">
                        <strong>30</strong>
                        <span>Minutes</span>
                    </button>


                    <button class="time-btn" data-time="45">
                        <strong>45</strong>
                        <span>Minutes</span>
                    </button>


                    <button class="time-btn" data-time="60">
                        <strong>1</strong>
                        <span>Hour</span>
                    </button>


                    <button class="time-btn" data-time="120">
                        <strong>2</strong>
                        <span>Hours</span>
                    </button>

                </div>

            </div>


            <div id="studyTimerSection" style="display:none;">

                <h2>Study Time Remaining</h2>

                <div id="studyTimer">
                    00:00:00
                </div>

                <p>
                    Enjoy your study time!
                </p>

                <button
                    class="exit-btn"
                    onclick="exitSeat()">
                    Exit Seat
                </button>

            </div>


            <button
                class="back-btn"
                onclick="goBackToDashboard()">
                Back to Seats
            </button>

        </div>

    </main>


    <script src="app.js"></script>

</body>

</html>
